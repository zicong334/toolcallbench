[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toolcallbench-cn"
version = "0.1.0"
description = "Bilingual benchmark for LLM function-calling reliability with deterministic sandbox grading"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "openai>=1.40",
    "pyyaml>=6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["tcb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
