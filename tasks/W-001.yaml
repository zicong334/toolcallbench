id: W-001
domain: weather
lang: zh
difficulty: easy
instruction: "查一下武汉明天(相对今天2026-10-27)的天气,告诉我最高气温、最低气温和湿度。"
tools: [get_weather, get_forecast, list_events]
max_turns: 6
grading:
  required_calls:
    - any_of:
        - tool: get_weather
          args:
            city: {equals: "武汉"}
            date: {equals: "2026-10-28"}
        - tool: get_forecast
          args:
            city: {equals: "武汉"}
            days: {in_set: [2, 3, 4, 5, 6, 7]}
  final_answer:
    must_include: ["9", "2", "57"]
