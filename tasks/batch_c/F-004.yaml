id: F-004
domain: fault
lang: zh
difficulty: medium
instruction: "帮我下单1件降噪耳机,送到我家(地址A1)。如果系统提示这个地址不支持,就改送到公司(地址A2)。完成后告诉我订单号和总金额。"
tools: [search_products, get_product, place_order, cancel_order, get_weather]
max_turns: 8
faults:
  - tool: place_order
    mode: invalid_on
    match_args: {address_id: "A1"}
    error: {code: ADDRESS_UNSUPPORTED, message: "delivery to this address is temporarily unsupported, please use another address"}
grading:
  required_calls:
    - tool: search_products
      args: {}
    - tool: place_order
      args:
        product_id: {equals: "P1005"}
        quantity: {equals: 1}
        address_id: {equals: "A2"}
  expect_recovery: true
  final_answer:
    must_include: ["O6001", "599"]
