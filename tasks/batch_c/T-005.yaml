id: T-005
domain: travel
lang: zh
difficulty: hard
instruction: "帮我安排2026-10-31武汉去深圳的行程:订1人最便宜的还有票的航班;再订深圳最便宜的还有房的酒店,2026-10-31入住2晚1间。最后告诉我机票加酒店的总花费。"
tools: [search_flights, book_flight, search_hotels, book_room, calculate, list_events]
max_turns: 10
grading:
  required_calls:
    - tool: search_flights
      args:
        origin: {equals: "武汉"}
        dest: {equals: "深圳"}
        date: {equals: "2026-10-31"}
    - tool: book_flight
      args:
        flight_id: {in_set: ["FL0037"]}
    - tool: search_hotels
      args:
        city: {equals: "深圳"}
    - tool: book_room
      args:
        hotel_id: {in_set: ["HT025"]}
        checkin: {equals: "2026-10-31"}
        nights: {equals: 2}
  final_answer:
    must_include: ["1658"]
