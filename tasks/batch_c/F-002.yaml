id: F-002
domain: fault
lang: zh
difficulty: easy
instruction: "查一下黄冈2026-10-30的天气,告诉我当天的天气状况和降水量。"
tools: [get_weather, get_forecast, search_products]
max_turns: 6
faults:
  - tool: get_weather
    mode: fail_n_times
    fail_times: 1
    error: {code: RATE_LIMITED, message: "too many requests, please retry later"}
grading:
  required_calls:
    - any_of:
        - tool: get_weather
          args:
            city: {equals: "黄冈"}
            date: {equals: "2026-10-30"}
        - tool: get_forecast
          args:
            city: {equals: "黄冈"}
            days: {in_set: [4, 5, 6, 7]}
  expect_recovery: true
  final_answer:
    must_include: ["小雨", "8"]
