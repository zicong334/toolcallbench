id: W-009
domain: weather
lang: en
difficulty: medium
instruction: "Compare the weather in Austin and Phoenix on 2026-10-31. Report the high temperature of each city, tell me which city is warmer, and by how many degrees Celsius."
tools: [get_weather, get_forecast, calculate, get_transactions]
max_turns: 8
grading:
  required_calls:
    - any_of:
        - tool: get_weather
          args:
            city: {equals: "Austin"}
            date: {equals: "2026-10-31"}
        - tool: get_forecast
          args:
            city: {equals: "Austin"}
            days: {in_set: [5, 6, 7]}
    - any_of:
        - tool: get_weather
          args:
            city: {equals: "Phoenix"}
            date: {equals: "2026-10-31"}
        - tool: get_forecast
          args:
            city: {equals: "Phoenix"}
            days: {in_set: [5, 6, 7]}
  final_answer:
    must_include: ["Phoenix", "29", "5", "24"]
