id: W-003
domain: weather
lang: zh
difficulty: easy
instruction: "今天是2026-10-27(周二)。帮我查一下宜昌后天的天气,告诉我当天的最低气温和湿度。"
tools: [get_weather, get_forecast, list_events]
max_turns: 6
grading:
  required_calls:
    - any_of:
        - tool: get_weather
          args:
            city: {equals: "宜昌"}
            date: {equals: "2026-10-29"}
        - tool: get_forecast
          args:
            city: {equals: "宜昌"}
            days: {in_set: [3, 4, 5, 6, 7]}
  final_answer:
    must_include: ["13", "47"]
