id: W-015
domain: weather
lang: en
difficulty: hard
instruction: "Drone survey site selection for 2026-10-29. Consider the six Hubei cities: Wuhan, Yichang, Xiangyang, Jingzhou, Huanggang and Shiyan. A city qualifies only if ALL of the following hold in the weather data for 2026-10-29 (judge strictly by the numbers, ignore condition labels such as 中雨/小雨): precip_mm < 5.0, wind_level <= 4, and humidity_pct < 80. If more than one city qualifies, pick the one with the highest temp_high_c. Note: the weather system stores these city names in its own format - if a lookup fails, inspect the error message for the list of accepted city names and retry with those; do not give up after a first failure. Report: (a) the chosen city, using the exact city name the weather system uses; (b) the chosen city's condition on 2026-10-29 exactly as returned by the tool, plus its temp_high_c, wind_level and humidity_pct; (c) how many of the six cities passed the precipitation gate alone (precip_mm < 5.0)."
tools: [get_weather, get_forecast, calculate, search_flights]
max_turns: 16
grading:
  required_calls:
    - any_of:
        - tool: get_weather
          args:
            city: {equals: "武汉"}
            date: {equals: "2026-10-29"}
        - tool: get_forecast
          args:
            city: {equals: "武汉"}
            days: {in_set: [3, 4, 5, 6, 7]}
    - any_of:
        - tool: get_weather
          args:
            city: {equals: "宜昌"}
            date: {equals: "2026-10-29"}
        - tool: get_forecast
          args:
            city: {equals: "宜昌"}
            days: {in_set: [3, 4, 5, 6, 7]}
    - any_of:
        - tool: get_weather
          args:
            city: {equals: "襄阳"}
            date: {equals: "2026-10-29"}
        - tool: get_forecast
          args:
            city: {equals: "襄阳"}
            days: {in_set: [3, 4, 5, 6, 7]}
    - any_of:
        - tool: get_weather
          args:
            city: {equals: "荆州"}
            date: {equals: "2026-10-29"}
        - tool: get_forecast
          args:
            city: {equals: "荆州"}
            days: {in_set: [3, 4, 5, 6, 7]}
    - any_of:
        - tool: get_weather
          args:
            city: {equals: "黄冈"}
            date: {equals: "2026-10-29"}
        - tool: get_forecast
          args:
            city: {equals: "黄冈"}
            days: {in_set: [3, 4, 5, 6, 7]}
    - any_of:
        - tool: get_weather
          args:
            city: {equals: "十堰"}
            date: {equals: "2026-10-29"}
        - tool: get_forecast
          args:
            city: {equals: "十堰"}
            days: {in_set: [3, 4, 5, 6, 7]}
  final_answer:
    must_include: ["宜昌", "阴", "47", "2026-10-29"]
    must_not_include: []
