id: O-016
domain: orders
lang: en
difficulty: hard
instruction: "Office restock with a twist. Buy exactly 6 units in total, split across exactly TWO different in-stock items from the 办公用品 (office supplies) category, all shipped to the office (address ID A2). Hard constraints: at most 4 units of any single item; the two items must be different; place one order per item. Among all the combinations that satisfy these constraints, choose the one with the LOWEST total cost. After ordering, report: the two product ids with the quantity ordered for each, each order's total, the grand total (CNY, two decimal places), and each order's share of the grand total (percentages rounded to one decimal place)."
tools: [search_products, get_product, place_order, cancel_order, calculate, get_weather]
max_turns: 12
grading:
  required_calls:
    - tool: search_products
      args:
        category: {equals: "办公用品"}
    - tool: place_order
      args:
        product_id: {equals: "P1008"}
        quantity: {equals: 4}
        address_id: {equals: "A2"}
    - tool: place_order
      args:
        product_id: {equals: "P1007"}
        quantity: {equals: 2}
        address_id: {equals: "A2"}
  final_answer:
    must_include: ["P1008", "P1007", "39.6", "31.8", "71.4", "55.5", "44.5"]
    # 判分口径(第10课):不设禁语。理由——① must_include 已锁死唯一最优解的两个
    # 商品ID、两个分项金额、总额与两个占比,required_calls 又锁了正确的下单参数,
    # 算错的答案不可能含 71.4,禁错误总额是冗余的;② 它还有害:模范答案会写出
    # "(vs ¥77.40 for 3+3 and ¥83.40 for 2+4)" 这类对比来论证最优性,禁 83.4 会
    # 把展示推理过程的正确答案判死(与 W-011 封次阈值降水、O-008 封对比表同类)。
    # 顺带记录:原禁语里的 "77.1" 连真实的错误总额都不是(9.9*3+15.9*3=77.4)。
    must_not_include: []
