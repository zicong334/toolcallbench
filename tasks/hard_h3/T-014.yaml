id: T-014
domain: travel
lang: zh
difficulty: hard
instruction: "我和同事一行2人要去北京出差。原计划2026-10-31从武汉飞北京,要求同一航班剩余座位不少于2张、起飞时间在18:00之前,在满足这两个条件的航班里订最便宜的一班(2人)。请先查询2026-10-31的航班:如果当天没有任何一班同时满足「余票不少于2张」和「18:00之前起飞」,就放弃当天,改订2026-10-30出发的航班,并按同样的规则(余票不少于2张、18:00之前起飞、最便宜)订2人。酒店:订北京还有房(剩余房间数不少于1间)的最便宜酒店,入住日期必须与最终出发日期一致,住2晚、1间。全部办完后报告:最终出发日期(YYYY-MM-DD)、航班ID和每人票价、2人机票合计、酒店ID和每晚房价、酒店合计,以及机票加酒店的总价(金额以元为单位,保留两位小数)。"
tools: [search_flights, book_flight, search_hotels, book_room, calculate, get_weather]
max_turns: 12
grading:
  required_calls:
    - tool: search_flights
      args:
        origin: {equals: "武汉"}
        dest: {equals: "北京"}
        date: {equals: "2026-10-31"}
    - tool: search_flights
      args:
        origin: {equals: "武汉"}
        dest: {equals: "北京"}
        date: {equals: "2026-10-30"}
    - tool: book_flight
      args:
        flight_id: {equals: "FL0010"}
        passengers: {equals: 2}
    - tool: search_hotels
      args:
        city: {equals: "北京"}
    - tool: book_room
      args:
        hotel_id: {equals: "HT018"}
        checkin: {equals: "2026-10-30"}
        nights: {equals: 2}
  final_answer:
    must_include: ["2026-10-30", "FL0010", "380", "760", "HT018", "239", "478", "1238"]
    must_not_include: ["1518", "1758"]
