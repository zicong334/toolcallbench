id: W-013
domain: weather
lang: zh
difficulty: hard
instruction: "公司要在武汉办一次户外团建,候选日期为2026-10-28至2026-11-02这6天。选定规则(必须同时满足):当天precip_mm等于0、temp_high_c不低于10、wind_level不高于5;如果有多天同时满足,选最早的一天。判断只看数值,不看天气状况标签。定好日期后请报告:(a) 选定的日期(YYYY-MM-DD);(b) 6个候选日precip_mm的总和(保留1位小数);(c) 2026-10-30当天的precip_mm占这个总降水量的百分比(保留1位小数)。"
tools: [get_weather, get_forecast, calculate, list_events]
max_turns: 10
grading:
  required_calls:
    - any_of:
        - tool: get_forecast
          args:
            city: {equals: "武汉"}
            days: {in_set: [6, 7, 8, 9, 10, 11, 12, 13, 14]}
        - tool: get_weather
          args:
            city: {equals: "武汉"}
            date: {equals: "2026-11-02"}
  final_answer:
    must_include: ["2026-10-31", "31.8", "69.5"]
    must_not_include: []
