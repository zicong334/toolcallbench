id: W-002
domain: weather
lang: en
difficulty: easy
instruction: "What will the weather be like in Boston on 2026-10-29? Report the high temperature and the humidity."
tools: [get_weather, get_forecast, search_products]
max_turns: 6
grading:
  required_calls:
    - any_of:
        - tool: get_weather
          args:
            city: {equals: "Boston"}
            date: {equals: "2026-10-29"}
        - tool: get_forecast
          args:
            city: {equals: "Boston"}
            days: {in_set: [3, 4, 5, 6, 7]}
  final_answer:
    must_include: ["6", "43"]
