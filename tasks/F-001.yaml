id: F-001
domain: fault
lang: zh
difficulty: medium
instruction: "查询宜昌2026-10-30的天气,告诉我当天最高气温。"
tools: [get_weather, get_forecast]
max_turns: 8
faults:
  - tool: get_weather
    mode: fail_n_times
    fail_times: 1
    error: {code: RATE_LIMITED, message: "too many requests, please retry later"}
grading:
  required_calls:
    - any_of:
        - tool: get_weather
          args:
            city: {equals: "宜昌"}
            date: {equals: "2026-10-30"}
        - tool: get_forecast
          args:
            city: {equals: "宜昌"}
            days: {in_set: [4, 5, 6, 7]}
  expect_recovery: true
  final_answer:
    must_include: ["15"]
